# Engineering entrypoint. Install Task: https://taskfile.dev
# Run `task` (or `task --list`) to see available targets.

version: "3"

env:
  COMPOSE_FILE: compose/docker-compose.yml

dotenv:
  - compose/.env

vars:
  CHART: deploy/chart
  KIND_CLUSTER: devops-stack
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  secrets:
    desc: Generate missing admin password files under compose/secrets/
    cmds:
      - sh scripts/gen-secrets.sh

  up:
    desc: Start the stack in the background and wait until it is healthy
    deps: [secrets]
    cmds:
      - docker compose up -d --wait

  obs:up:
    desc: Start the stack plus the observability profile and wait for health
    deps: [secrets]
    cmds:
      - docker compose --profile observability up -d --wait

  # down and clean name the observability profile so its containers and
  # volumes go too; without it compose leaves profiled services running.
  down:
    desc: Stop the stack (observability profile included) and remove containers
    cmds:
      - docker compose --profile observability down

  build:
    desc: Build all images in the suite (counter + the profiled dockerctl CLI)
    cmds:
      - docker compose --profile tools build

  pull:
    desc: Pull all referenced images
    cmds:
      - docker compose pull

  logs:
    desc: Tail logs from all services
    cmds:
      - docker compose logs -f

  clean:
    desc: Stop the stack (observability profile included) and remove its volumes
    cmds:
      - docker compose --profile observability down --volumes

  # Python tasks run from cli/uv.lock, so local tools match CI exactly.
  test:
    desc: Run the dockerctl unit test suite (from the lockfile)
    dir: cli
    cmds:
      - uv run --locked --extra test pytest

  fmt:
    desc: Auto-format Python code with ruff
    dir: cli
    cmds:
      - uv run --locked --extra dev ruff format .
      - uv run --locked --extra dev ruff check --fix .

  typecheck:
    desc: Type-check the dockerctl CLI with mypy
    dir: cli
    cmds:
      - uv run --locked --extra dev mypy dockerctl tests

  lock:
    desc: Re-resolve cli/uv.lock after changing dependencies in pyproject.toml
    dir: cli
    cmds:
      - uv lock

  lint:
    desc: Run all linters (compose, then every pre-commit hook)
    cmds:
      - docker compose config --quiet
      - uvx pre-commit run --all-files

  # Trivy runs from a pinned image and reads the local images through the
  # engine socket, which gives it full engine access for the duration.
  scan:
    desc: Build both images and scan them with Trivy (fails on fixable HIGH/CRITICAL)
    deps: [build]
    cmds:
      - for: [compose-counter, dockerctl:local]
        cmd: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          {{.TRIVY_IMAGE}} image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 {{.ITEM}}

  sbom:
    desc: Build both images and write CycloneDX SBOMs to ./sbom/
    deps: [build]
    cmds:
      - mkdir -p sbom
      - for: [compose-counter, dockerctl:local]
        cmd: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out"
          {{.TRIVY_IMAGE}} image --format cyclonedx
          --output "/out/{{.ITEM | replace ":" "-"}}.cdx.json" {{.ITEM}}

  # Runs from the repo root so `dockerctl compose` finds compose/docker-compose.yml.
  cli:
    desc: 'Run the dockerctl CLI, e.g. `task cli -- compose ps`'
    cmds:
      - uv run --locked --project cli dockerctl {{.CLI_ARGS}}

  # The Helm chart under deploy/chart. kind:test runs the same steps as the
  # CI helm job on a throwaway local cluster (needs helm, kind and kubectl).
  chart:lint:
    desc: Lint the Helm chart (strict) and check it against its values schema
    cmds:
      - helm lint --strict {{.CHART}}

  chart:template:
    desc: Render the Helm chart with its default values
    cmds:
      - helm template devops-stack {{.CHART}}

  kind:test:
    desc: Install the chart on a local kind cluster under the restricted profile, then helm test
    cmds:
      - kind create cluster --name {{.KIND_CLUSTER}} --wait 120s
      - defer: kind delete cluster --name {{.KIND_CLUSTER}}
      - docker build -t counter:local images/counter
      - kind load docker-image counter:local --name {{.KIND_CLUSTER}}
      - kubectl create namespace stack
      - kubectl label namespace stack pod-security.kubernetes.io/enforce=restricted
      - >-
        helm install devops-stack {{.CHART}} -n stack --wait --timeout 5m
        --set counter.image.repository=counter
        --set counter.image.tag=local
        --set counter.image.pullPolicy=Never
      - helm test devops-stack -n stack --logs
