# Weekly dependency updates for every ecosystem in the repo.
# The docker ecosystem watches the Dockerfiles (including the pinned uv
# stage); docker-compose watches the tag@digest image pins written literally
# in compose/docker-compose.yml; uv updates cli/uv.lock.
#
# Every ecosystem waits 7 days after a release before proposing it, so a
# compromised or broken release has time to be caught upstream first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Action bumps arrive as one weekly PR instead of one per action.
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/cli"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor/patch python updates arrive as one weekly PR instead of five.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories: ["/cli", "/images/counter"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: "/compose"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # nginx odd minor versions (1.31, 1.33) are its mainline line; the
      # stack stays on the stable line (even minors). Add the next odd minor
      # here when the stable line moves on. A bump of nginx or httpd also
      # needs the same tag and digest in deploy/chart/values.yaml.
      - dependency-name: "nginxinc/nginx-unprivileged"
        versions: [">= 1.31, < 1.32", ">= 1.33, < 1.34"]
