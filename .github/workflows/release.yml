name: Release

# Every v* tag: check the tag against the package version and changelog, run
# the full CI suite on the tagged commit, publish through the shared
# scan-sign-tag workflow, then create the GitHub Release. No tag moves on
# GHCR unless every earlier step passed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # The tag is semver (v0.3.0, v0.3.0-rc.1); pyproject.toml is PEP 440
      # (0.3.0, 0.3.0rc1). packaging normalises both before comparing. A
      # stable release also needs its own CHANGELOG section.
      - name: Assert the tag matches cli/pyproject.toml and CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --python 3.12 --with packaging==25.0 python - <<'PY'
          import os, re, sys, tomllib
          from packaging.version import Version

          tag = os.environ["TAG"].removeprefix("v")
          with open("cli/pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]["version"]
          if Version(tag) != Version(project):
              sys.exit(f"tag v{tag} does not match cli/pyproject.toml version {project}")
          if not Version(tag).is_prerelease:
              changelog = open("CHANGELOG.md", encoding="utf-8").read()
              if not re.search(rf"^## \[{re.escape(tag)}\]", changelog, re.MULTILINE):
                  sys.exit(f"CHANGELOG.md has no '## [{tag}]' section")
          print(f"v{tag} matches cli/pyproject.toml ({project})")
          PY

  # The whole CI workflow against the tagged commit. A called workflow can
  # only use permissions its caller grants, and GitHub checks every nested
  # job up front, so this grants the union: security-events for the image
  # job's SARIF upload, packages and id-token for ci.yml's publish job
  # (which skips itself on tags).
  checks:
    needs: guard
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    # ./ already runs the callee from this commit; the newer $/ form is not
    # understood by actionlint yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  publish:
    needs: checks
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (OIDC)
    uses: ./.github/workflows/_publish.yml # zizmor: ignore[self-repository]
    with:
      mode: release

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # gh ships on the runner, so no third-party release action is needed.
      # --notes is prepended to the generated notes. Tags with a semver
      # prerelease part (v0.3.0-rc.1) become prereleases. A re-run after the
      # release exists leaves it as it is instead of failing.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: |
            Container images:
            `ghcr.io/www8351/docker-devops-tooling/counter` and
            `ghcr.io/www8351/docker-devops-tooling/dockerctl`
            (tags: this version, plus major.minor and latest for stable releases).

            See [CHANGELOG.md](https://github.com/www8351/Docker-DevOps-Tooling/blob/main/CHANGELOG.md)
            for the curated list of changes.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$NOTES")
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}"
