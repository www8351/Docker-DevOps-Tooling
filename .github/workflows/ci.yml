name: CI

on:
  # Branch pushes are covered by their pull request; main still runs (and
  # publishes) on every merge. workflow_call lets release.yml gate on it.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Least privilege by default; jobs that need more escalate explicitly.
permissions:
  contents: read

# One run per pull request or ref. Superseded PR runs are cancelled; runs on
# main and tags are not, so a publish never stops half way.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose file
        run: docker compose -f compose/docker-compose.yml config --quiet

      - name: Assert published ports bind to loopback by default
        run: |
          docker compose -f compose/docker-compose.yml --profile observability --profile tools \
            config --format json \
            | python3 -c "import json,sys; s=json.load(sys.stdin)['services']; p=[(n,x) for n,v in s.items() for x in v.get('ports',[])]; bad=[n for n,x in p if x.get('host_ip')!='127.0.0.1']; print('published:', len(p), 'off loopback:', bad); sys.exit(1 if bad or not p else 0)"

      - name: Lint counter Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/counter/Dockerfile

      - name: Lint dockerctl Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: cli/Dockerfile

      - name: Lint shell scripts (shellcheck)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          additional_files: counter.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Lint Python (ruff)
        run: |
          pip install ruff
          ruff check cli
          ruff format --check cli

      - name: Import-check the CLI
        run: |
          pip install -e 'cli[dev]'
          dockerctl version

      - name: Type-check (mypy)
        run: mypy --config-file cli/pyproject.toml cli/dockerctl cli/tests

      - name: Run tests (pytest, coverage-gated)
        run: pytest cli

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: counter
            context: images/counter
          - name: dockerctl
            context: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The image job is the first place the built venv meets its runtime
      # interpreter; prove the entrypoint actually imports before scanning.
      - name: Smoke-run the dockerctl image
        if: matrix.name == 'dockerctl'
        run: docker run --rm dockerctl:ci version

      - name: Scan ${{ matrix.name }} image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          # Images are hardened, so gate the build on findings. Unpatchable
          # base-image CVEs (no fix upstream yet) are ignored so CI stays green.
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM for ${{ matrix.name }} (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:ci
          format: cyclonedx
          output: ${{ matrix.name }}-sbom.cdx.json
          # SBOM generation documents the image; it must never gate the build.
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: ${{ matrix.name }}-sbom.cdx.json
          retention-days: 30

  # Boot the actual hardened stack: --wait turns every compose healthcheck
  # into a CI assertion, and the curl probes prove the read-only/cap-dropped
  # services really serve traffic.
  stack-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Admin passwords have no defaults: without the secret files the
      # services that need them must refuse to start, and for that reason
      # (not a pull or network error).
      - name: Assert the stack fails closed without admin secrets
        run: |
          cp compose/.env.example compose/.env
          compose="docker compose -f compose/docker-compose.yml --profile observability"
          $compose pull --quiet portainer grafana
          for svc in portainer grafana; do
            if out=$($compose up -d --no-deps "$svc" 2>&1); then
              echo "$svc started without its admin secret" >&2
              exit 1
            fi
            echo "$out" | grep -q "secrets/${svc}_admin_password" \
              || { echo "$svc failed for another reason: $out" >&2; exit 1; }
            [ -z "$($compose ps -q "$svc")" ] || { echo "$svc container is running" >&2; exit 1; }
            echo "$svc refused to start without compose/secrets/${svc}_admin_password"
          done
          $compose down -v

      - name: Boot the hardened stack + observability profile (healthchecks gate)
        run: |
          scripts/gen-secrets.sh
          docker compose -f compose/docker-compose.yml --profile observability up -d --wait --wait-timeout 180

      - name: Probe web endpoints
        run: |
          curl -fsS -o /dev/null -w 'nginx :8080 -> %{http_code}\n' http://localhost:8080
          curl -fsS -o /dev/null -w 'httpd :8081 -> %{http_code}\n' http://localhost:8081

      - name: Probe observability endpoints
        run: |
          curl -fsS -o /dev/null -w 'prometheus /-/healthy -> %{http_code}\n' http://localhost:9090/-/healthy
          curl -fsS -o /dev/null -w 'grafana /api/health -> %{http_code}\n' http://localhost:3000/api/health
          # The admin password is the generated secret, and admin/admin is refused.
          curl -fsS -o /dev/null -w 'grafana /api/user with secret -> %{http_code}\n' \
            -u "admin:$(cat compose/secrets/grafana_admin_password)" http://localhost:3000/api/user
          code=$(curl -sS -o /dev/null -w '%{http_code}' -u admin:admin http://localhost:3000/api/user)
          echo "grafana /api/user with admin:admin -> $code"
          [ "$code" = "401" ]

      - name: Probe Portainer admin provisioning
        run: |
          # The admin account exists from the first start; no setup page to claim.
          jq -n --rawfile p compose/secrets/portainer_admin_password '{username: "admin", password: $p}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- http://localhost:9000/api/auth \
            | jq -e 'has("jwt")' >/dev/null
          echo "portainer /api/auth with secret -> jwt"
          # Scrape pipeline actually works: every prometheus target reports up.
          scripts/wait-prom-targets.sh http://localhost:9090 120

      # cAdvisor runs with /sys as its only mount and no engine socket; prove
      # that is still enough to attribute metrics to individual containers.
      - name: Assert cAdvisor sees containers without engine sockets
        run: |
          cadvisor=$(docker compose -f compose/docker-compose.yml ps -q cadvisor)
          mounts=$(docker inspect -f '{{range .Mounts}}{{.Source}} {{end}}' "$cadvisor")
          echo "cadvisor mounts: $mounts"
          [ "$mounts" = "/sys " ] || { echo "unexpected cadvisor mounts" >&2; exit 1; }
          cid=$(docker compose -f compose/docker-compose.yml ps -q nginx | cut -c1-12)
          for _ in $(seq 1 20); do
            n=$(curl -fsS http://localhost:9090/api/v1/query \
                  --data-urlencode "query=count(container_memory_working_set_bytes{container_id=\"$cid\"})" \
                | python3 -c "import json,sys; r=json.load(sys.stdin)['data']['result']; print(r[0]['value'][1] if r else 0)")
            if [ "$n" != "0" ]; then echo "nginx $cid memory series: $n"; exit 0; fi
            sleep 3
          done
          echo "no cAdvisor series for nginx container $cid" >&2
          exit 1

      - name: Show stack state
        run: docker compose -f compose/docker-compose.yml ps

      # One live integration test against a real engine, complementing the
      # fully-mocked unit suite: the dockerctl image drives the runner's socket.
      # The image runs as non-root (UID 10001), so grant it the socket's group
      # instead of root — hardening stays intact.
      - name: Live dockerctl smoke test
        run: |
          docker compose -f compose/docker-compose.yml --profile tools build dockerctl
          docker run --rm \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            dockerctl:local containers ls

      - name: Tear down
        if: always()
        run: docker compose -f compose/docker-compose.yml --profile observability down -v

  publish:
    needs: [lint, image, stack-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: counter
            context: images/counter
          - name: dockerctl
            context: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/www8351/docker-devops-tooling/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Push ${{ matrix.name }} to GHCR (multi-arch, attested)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign ${{ matrix.name }} (keyless, OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/www8351/docker-devops-tooling/${{ matrix.name }}@${DIGEST}"
