name: CI

on:
  # Branch pushes are covered by their pull request; main runs (and
  # publishes) after merges. workflow_call lets release.yml gate on it.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Least privilege by default; jobs that need more escalate explicitly.
permissions:
  contents: read

# One run per pull request or ref. Superseded PR runs are cancelled. Runs on
# main and tags are never cancelled once started, so a publish never stops
# half way; they queue one at a time, and a newer merge replaces one still
# waiting, so latest only ever moves forward.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv for every setup-uv step. Must equal the uv image tag in cli/Dockerfile,
# which Dependabot bumps; the workflow-lint job fails while they differ, so a
# uv bump updates this line in the same pull request.
env:
  UV_VERSION: "0.13.5"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose file
        run: docker compose -f compose/docker-compose.yml config --quiet

      - name: Assert published ports bind to loopback by default
        run: |
          docker compose -f compose/docker-compose.yml --profile observability --profile tools \
            config --format json \
            | python3 -c "import json,sys; s=json.load(sys.stdin)['services']; p=[(n,x) for n,v in s.items() for x in v.get('ports',[])]; bad=[n for n,x in p if x.get('host_ip')!='127.0.0.1']; print('published:', len(p), 'off loopback:', bad); sys.exit(1 if bad or not p else 0)"

      - name: Lint counter Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/counter/Dockerfile

      - name: Lint dockerctl Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: cli/Dockerfile

      - name: Lint shell scripts (shellcheck)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          additional_files: counter.sh

      # Lint, types and tests run on the oldest supported Python, with every
      # tool at the version cli/uv.lock pins.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install the locked environment
        working-directory: cli
        run: uv sync --locked --extra dev --python 3.11

      - name: Lint Python (ruff)
        working-directory: cli
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Import-check the CLI
        working-directory: cli
        run: uv run --locked dockerctl version

      - name: Type-check (mypy)
        working-directory: cli
        run: uv run --locked mypy dockerctl tests

      - name: Run tests (pytest, coverage-gated)
        working-directory: cli
        run: uv run --locked pytest

  # Static analysis of the workflows themselves: actionlint (with shellcheck
  # on every run: block) and zizmor's security audits, including the online
  # ones (known-vulnerable or impostor action commits) with a read-only token.
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert CI pins the uv version cli/Dockerfile uses
        run: |
          want=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([^@]*\)@.*|\1|p' cli/Dockerfile)
          [ -n "$want" ] || { echo "no uv image tag found in cli/Dockerfile" >&2; exit 1; }
          for f in .github/workflows/ci.yml .github/workflows/release.yml; do
            got=$(sed -n 's/^  UV_VERSION: "\(.*\)"$/\1/p' "$f")
            if [ "$got" != "$want" ]; then
              echo "$f pins uv '$got', cli/Dockerfile uses '$want'" >&2
              exit 1
            fi
            echo "$f -> uv $got"
          done

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format github .github/

  # The rest of the supported range. Not a required status check in the
  # branch ruleset (lint covers 3.11), but publish and releases wait for it.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Run tests on Python ${{ matrix.python }}
        working-directory: cli
        run: uv run --locked --python "${{ matrix.python }}" --extra test pytest

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Trivy results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: counter
            context: images/counter
          - name: dockerctl
            context: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The image job is the first place the built venv meets its runtime
      # interpreter; prove the entrypoint actually imports before scanning.
      - name: Smoke-run the dockerctl image
        if: matrix.name == 'dockerctl'
        run: docker run --rm dockerctl:ci version

      - name: Scan ${{ matrix.name }} image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          # Images are hardened, so gate the build on findings. Unpatchable
          # base-image CVEs (no fix upstream yet) are ignored so CI stays green.
          ignore-unfixed: true
          exit-code: "1"

      # Same scan as SARIF, so findings (including unfixed ones the gate
      # ignores) show up in code scanning. Never gates the build, and the
      # upload is allowed to fail where the token cannot write alerts
      # (Dependabot and fork PRs).
      - name: Scan ${{ matrix.name }} image for code scanning (Trivy, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF for ${{ matrix.name }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Generate SBOM for ${{ matrix.name }} (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:ci
          format: cyclonedx
          output: ${{ matrix.name }}-sbom.cdx.json
          # SBOM generation documents the image; it must never gate the build.
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: ${{ matrix.name }}-sbom.cdx.json
          retention-days: 30

  # Boot the actual hardened stack: --wait turns every compose healthcheck
  # into a CI assertion, and the curl probes prove the read-only/cap-dropped
  # services really serve traffic.
  stack-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Admin passwords have no defaults: without the secret files the
      # services that need them must refuse to start, and for that reason
      # (not a pull or network error).
      - name: Assert the stack fails closed without admin secrets
        run: |
          cp compose/.env.example compose/.env
          compose="docker compose -f compose/docker-compose.yml --profile observability"
          $compose pull --quiet portainer grafana
          for svc in portainer grafana; do
            if out=$($compose up -d --no-deps "$svc" 2>&1); then
              echo "$svc started without its admin secret" >&2
              exit 1
            fi
            echo "$out" | grep -q "secrets/${svc}_admin_password" \
              || { echo "$svc failed for another reason: $out" >&2; exit 1; }
            [ -z "$($compose ps -q "$svc")" ] || { echo "$svc container is running" >&2; exit 1; }
            echo "$svc refused to start without compose/secrets/${svc}_admin_password"
          done
          $compose down -v

      - name: Boot the hardened stack + observability profile (healthchecks gate)
        run: |
          scripts/gen-secrets.sh
          docker compose -f compose/docker-compose.yml --profile observability up -d --wait --wait-timeout 180

      - name: Probe web endpoints
        run: |
          curl -fsS -o /dev/null -w 'nginx :8080 -> %{http_code}\n' http://localhost:8080
          curl -fsS -o /dev/null -w 'httpd :8081 -> %{http_code}\n' http://localhost:8081

      - name: Probe observability endpoints
        run: |
          curl -fsS -o /dev/null -w 'prometheus /-/healthy -> %{http_code}\n' http://localhost:9090/-/healthy
          curl -fsS -o /dev/null -w 'grafana /api/health -> %{http_code}\n' http://localhost:3000/api/health
          # The admin password is the generated secret, and admin/admin is refused.
          curl -fsS -o /dev/null -w 'grafana /api/user with secret -> %{http_code}\n' \
            -u "admin:$(cat compose/secrets/grafana_admin_password)" http://localhost:3000/api/user
          code=$(curl -sS -o /dev/null -w '%{http_code}' -u admin:admin http://localhost:3000/api/user)
          echo "grafana /api/user with admin:admin -> $code"
          [ "$code" = "401" ]

      - name: Probe Portainer admin provisioning
        run: |
          # The admin account exists from the first start; no setup page to claim.
          jq -n --rawfile p compose/secrets/portainer_admin_password '{username: "admin", password: $p}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- http://localhost:9000/api/auth \
            | jq -e 'has("jwt")' >/dev/null
          echo "portainer /api/auth with secret -> jwt"
          # Scrape pipeline actually works: every prometheus target reports up.
          scripts/wait-prom-targets.sh http://localhost:9090 120

      # cAdvisor runs with /sys as its only mount and no engine socket; prove
      # that is still enough to attribute metrics to individual containers.
      - name: Assert cAdvisor sees containers without engine sockets
        run: |
          cadvisor=$(docker compose -f compose/docker-compose.yml ps -q cadvisor)
          mounts=$(docker inspect -f '{{range .Mounts}}{{.Source}} {{end}}' "$cadvisor")
          echo "cadvisor mounts: $mounts"
          [ "$mounts" = "/sys " ] || { echo "unexpected cadvisor mounts" >&2; exit 1; }
          cid=$(docker compose -f compose/docker-compose.yml ps -q nginx | cut -c1-12)
          for _ in $(seq 1 20); do
            n=$(curl -fsS http://localhost:9090/api/v1/query \
                  --data-urlencode "query=count(container_memory_working_set_bytes{container_id=\"$cid\"})" \
                | python3 -c "import json,sys; r=json.load(sys.stdin)['data']['result']; print(r[0]['value'][1] if r else 0)")
            if [ "$n" != "0" ]; then echo "nginx $cid memory series: $n"; exit 0; fi
            sleep 3
          done
          echo "no cAdvisor series for nginx container $cid" >&2
          exit 1

      - name: Show stack state
        run: docker compose -f compose/docker-compose.yml ps

      # One live integration test against a real engine, complementing the
      # fully-mocked unit suite: the dockerctl image drives the runner's socket.
      # The image runs as non-root (UID 10001), so grant it the socket's group
      # instead of root — hardening stays intact.
      # Arguments reach docker after `--`, so drive a few commands that take
      # positionals against the real engine, and confirm the image (which has
      # no compose plugin) fails cleanly on the compose group.
      - name: Live dockerctl smoke test
        run: |
          docker compose -f compose/docker-compose.yml --profile tools build dockerctl
          dctl() {
            docker run --rm \
              --group-add "$(stat -c '%g' /var/run/docker.sock)" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              dockerctl:local "$@"
          }
          dctl containers ls
          dctl containers inspect --json compose-nginx-1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); h=d['State']['Health']['Status']; print('inspect ->', d['Name'], h); sys.exit(0 if d['Name'] == '/compose-nginx-1' and h == 'healthy' else 1)"
          dctl containers logs --tail 1 compose-counter-1
          # No compose plugin in the image: expect docker's own usage error and
          # exit 1 from the docker_errors() path, not a crash or a silent pass.
          rc=0
          out=$(dctl compose ps 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ] || ! grep -Eq "unknown shorthand flag|unknown command|is not a docker command" <<<"$out"; then
            echo "expected exit 1 with docker's usage error, got exit $rc" >&2
            exit 1
          fi
          echo "compose inside the image -> exit 1, as documented"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: dockerctl compose against the live stack (host)
        run: |
          # docker compose prints one JSON object per line (v2.21+) or a single
          # array (older releases); accept both.
          uv run --locked --project cli dockerctl compose ps --profile observability --json \
            | python3 -c "import json,sys; t=sys.stdin.read().strip(); rows=json.loads(t) if t.startswith('[') else [json.loads(l) for l in t.splitlines() if l.strip()]; svc=sorted(r['Service'] for r in rows); print('compose ps ->', svc); sys.exit(0 if {'nginx','counter','grafana'} <= set(svc) else 1)"

      - name: Tear down
        if: always()
        run: docker compose -f compose/docker-compose.yml --profile observability down -v

  # The Helm chart on a real cluster. The chart's web images and httpd.conf
  # must match compose; then it installs into a kind namespace that enforces
  # the restricted Pod Security Standard, every Deployment must roll out,
  # helm test fetches both web services, and the NetworkPolicy must block
  # what it does not allow. counter is built here and loaded into the node.
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NS: stack
      RELEASE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Assert the chart and compose run the same images and httpd.conf
        run: |
          diff -q compose/httpd/httpd.conf deploy/chart/files/httpd.conf
          rendered=$(helm template "$RELEASE" deploy/chart)
          services=$(docker compose -f compose/docker-compose.yml config --format json)
          for svc in nginx httpd; do
            want=$(jq -r ".services.$svc.image" <<<"$services")
            if ! grep -qF "image: \"$want\"" <<<"$rendered"; then
              echo "chart $svc image differs from compose: $want" >&2
              exit 1
            fi
            echo "$svc -> $want"
          done

      - name: Lint the chart
        run: helm lint --strict deploy/chart

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: chart-testing

      - name: Build counter and load it into the node
        run: |
          docker build -t counter:ci images/counter
          kind load docker-image counter:ci --name chart-testing

      # The namespace must really enforce the profile, or admitting the chart
      # proves nothing: a pod without a security context is refused first.
      - name: Create a namespace that enforces the restricted profile
        run: |
          kubectl create namespace "$NS"
          kubectl label namespace "$NS" \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=v1.37
          rc=0
          out=$(kubectl -n "$NS" run pss-probe --image=busybox --restart=Never --dry-run=server 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ] || ! grep -q 'violates PodSecurity "restricted' <<<"$out"; then
            echo "namespace $NS does not enforce the restricted profile" >&2
            exit 1
          fi

      - name: Install the chart
        run: |
          helm install "$RELEASE" deploy/chart -n "$NS" --wait --timeout 5m \
            --set counter.image.repository=counter \
            --set counter.image.tag=ci \
            --set counter.image.pullPolicy=Never
          for component in nginx httpd counter; do
            kubectl -n "$NS" rollout status "deploy/$RELEASE-devops-stack-$component" --timeout 120s
          done
          kubectl -n "$NS" get pods -o wide

      - name: helm test
        run: helm test "$RELEASE" -n "$NS" --logs

      # helm test just reached httpd from the test pod, which its policy
      # allows. nginx may open no connection at all, so the same request from
      # nginx straight to the httpd pod must fail at the network (dropped or
      # rejected), while nginx can still fetch its own page, which shows wget
      # and exec work. Traffic between a pod and its own node is always
      # allowed, so the target is a pod, not the API server.
      - name: Assert the NetworkPolicy is enforced
        run: |
          nginx="deploy/$RELEASE-devops-stack-nginx"
          ip=$(kubectl -n "$NS" get pod -l app.kubernetes.io/component=httpd \
            -o jsonpath='{.items[0].status.podIP}')
          kubectl -n "$NS" exec "$nginx" -- wget -q -T 5 -O /dev/null http://127.0.0.1:8080/
          echo "nginx -> itself: 200"
          rc=0
          out=$(kubectl -n "$NS" exec "$nginx" -- wget -q -T 5 -O /dev/null "http://$ip:8080/" 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ] || ! grep -Eq "timed out|refused|No route|unreachable" <<<"$out"; then
            echo "nginx -> httpd $ip:8080 was not blocked (exit $rc)" >&2
            exit 1
          fi
          echo "nginx -> httpd $ip:8080: blocked by NetworkPolicy"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs --all-containers --prefix --tail 50 \
            -l "app.kubernetes.io/instance=$RELEASE" || true

  publish:
    needs: [lint, test, workflow-lint, image, stack-test, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (OIDC)
    # ./ already runs the callee from this commit; the newer $/ form is not
    # understood by actionlint yet.
    uses: ./.github/workflows/_publish.yml # zizmor: ignore[self-repository]
    with:
      mode: main

  # The publish pipeline end to end on every pull request, against a
  # throwaway local registry and without signing, so a broken publish shows
  # up before it reaches main.
  publish-dry-run:
    needs: [image]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # ./ already runs the callee from this commit; the newer $/ form is not
    # understood by actionlint yet.
    uses: ./.github/workflows/_publish.yml # zizmor: ignore[self-repository]
    with:
      mode: dry-run
