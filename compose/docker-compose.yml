# Declarative replacement for the old `docker run` menu scripts.
# Paths are relative to this file; run via `docker compose` or the Taskfile.
#
# Usage:
#   docker compose --env-file .env up -d
#   docker compose config        # validate without starting anything
#
# Hardening baseline (applied per service below):
#   - images pinned by tag and digest, written literally so Dependabot can
#     bump them (alpine variants provide busybox wget for healthchecks); to
#     run a different image, layer an override file with a second -f
#   - published ports bind to loopback unless WEB_BIND_ADDR / ADMIN_BIND_ADDR
#     say otherwise; the admin UIs and the web tier are opened separately
#   - healthchecks on every long-running service that can support one
#   - network tiers: `web` (public-facing), `nginx-status` (internal, stub_status
#     only), `metrics` (prometheus, grafana, cadvisor), `mgmt` (portainer and
#     its docker.sock); services that need no network get none
#   - read-only root filesystems with tmpfs for known write paths
#   - all capabilities dropped, only the minimum added back
#   - no-new-privileges, CPU/memory limits, bounded json-file logging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Static web server, serving ../web read-only (was Create_Web_Server.sh / nginx_exec.sh).
  # nginx-unprivileged runs as UID 101 on port 8080 and keeps its pid and
  # temp files under /tmp, so it needs no capabilities at all.
  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24@sha256:782bb89768cc87b7f95c18b95baa1af250e5d451f26794f59363540161147c01
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:${NGINX_PORT:-8080}:8080"
    volumes:
      - ../web:/usr/share/nginx/html:ro
      # stub_status on :8082 (not host-mapped) for the observability profile.
      - ./nginx/status.conf:/etc/nginx/conf.d/status.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [web, nginx-status]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # Apache, replacing the old (nonexistent) "apache2" image with the real httpd.
  httpd:
    image: httpd:2.4.69-alpine3.24@sha256:3440c39d8d6f54fa9ad2549e5a60c19ddd435faadc29c1ad28aa795f71888889
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:${HTTPD_PORT:-8081}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /usr/local/apache2/logs # httpd.pid lives here
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [web]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # Docker management UI, replacing the dead abh1nav/dockerui.
  # No healthcheck: portainer-ce is scratch-based (no shell, wget, or curl),
  # so there is no exec probe to run; `restart: unless-stopped` covers crashes.
  # The socket stays read-write on purpose — Portainer manages the engine.
  portainer:
    image: portainer/portainer-ce:2.39.8@sha256:da7f74b74c7f37c50d2ebd3db4c6bcfdbf2fe9ca1e8b4c6c0203e39fde1fd249
    ports:
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [mgmt]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # Custom image built from ../images/counter (was lab2 Dockerfile + counter.sh).
  # `init: true` so the sleep loop gets a proper PID 1 and honors SIGTERM.
  # The healthcheck reads the loop's heartbeat file (on the /tmp tmpfs), so a
  # stalled loop turns the container unhealthy. It needs no network at all.
  counter:
    build:
      context: ../images/counter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/counter.sh", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M

  # The dockerctl CLI image. It is a one-shot tool, not a daemon, so it lives
  # behind the "tools" profile: `docker compose --profile tools build dockerctl`
  # builds it without it ever starting on `docker compose up`.
  # No healthcheck: it runs a command and exits.
  dockerctl:
    profiles: ["tools"]
    build:
      context: ../cli
    image: dockerctl:local
    # Mount the host socket to drive the real engine; safe to omit for --help.
    # No network: the client reaches the engine over that unix socket, and
    # pulls and pushes run inside the daemon, not in this container.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # ------------------------------------------------------------------
  # Observability profile — `docker compose --profile observability up`
  # Same hardening baseline as the core stack: pinned tags, read-only
  # rootfs, cap_drop ALL, no-new-privileges, memory limits, bounded logs.
  # Explicitly out of scope: Alertmanager, Loki.
  # ------------------------------------------------------------------

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    ports:
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [metrics]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.13@sha256:41bbc1b5e04416f81891806076db2a2ff60a5d4da5f78d36a88b033a8c199185
    ports:
      - "${ADMIN_BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [metrics]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # Container-level CPU and memory metrics, read straight from the host's
  # cgroup tree. No docker.sock, no containerd socket, no host rootfs:
  # cAdvisor's Docker integration needs both engine sockets, and either one
  # is root-equivalent on the host. Without them containers are identified
  # by cgroup id (Prometheus derives a short `container_id` label) instead of
  # by name, and per-container network counters are not available.
  # `cgroup: host` lets it see every container's cgroup on cgroup v2 hosts.
  cadvisor:
    profiles: ["observability"]
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    volumes:
      - /sys:/sys:ro
    cgroup: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [metrics]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M

  # No healthcheck: distroless-style image, no shell to probe; prometheus's
  # `up` metric for the nginx job covers liveness.
  nginx-exporter:
    profiles: ["observability"]
    image: nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
    command: ["--nginx.scrape-uri=http://nginx:8082/stub_status"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # nginx-status to reach nginx's stub_status, metrics so prometheus can
    # scrape it. It never joins the public web tier.
    networks: [nginx-status, metrics]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M

networks:
  # Public-facing web servers.
  web:
  # nginx stub_status and its exporter only; internal, no route out.
  nginx-status:
    internal: true
  # Prometheus, Grafana and cAdvisor. Not internal: two of them publish ports.
  metrics:
  # Portainer, the only service holding docker.sock in the default stack.
  mgmt:

volumes:
  portainer_data:
  prometheus_data:
  grafana_data:
