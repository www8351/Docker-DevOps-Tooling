# Minimal Apache httpd 2.4 configuration for an unprivileged, read-only
# container. Used by compose (mounted over the image's httpd.conf) and by the
# Helm chart (deploy/chart/files/httpd.conf); CI fails if the two copies drift.
#
# - listens on 8080, so no capability is needed to bind
# - runs as whatever non-root user starts it (uid 82, www-data); with no root
#   start there is nothing to drop, so there are no User/Group directives
# - every runtime file (pid, mutexes) lives in /tmp, the only writable path
# - logs go to the container's stdout and stderr
# - serves the image's own htdocs, read-only

ServerRoot "/usr/local/apache2"
Listen 8080
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so

DefaultRuntimeDir "/tmp"
PidFile "/tmp/httpd.pid"

ServerTokens Prod
ServerSignature Off
TraceEnable Off
Header always set X-Content-Type-Options "nosniff"

DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/usr/local/apache2/htdocs">
    Options None
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex index.html

TypesConfig conf/mime.types

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common
